<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光之圣女的小秘密</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="app__header-bg"></div>
      <div class="app__header-content">
        <div class="app__logo">
          <span class="app__logo-icon">&#10022;</span>
          <div>
            <h1 class="app__title">光之圣女的小秘密</h1>
            <p class="app__subtitle">工具集合 · Tool Collection Hub</p>
          </div>
        </div>
        <div class="app__header-right">
          <select class="app__lang-select" id="langSelect">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
          </select>
          <span class="app__version" id="version">v1.0.0</span>
          <button class="app__update-btn" id="updateBtn" title="检查更新">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Hub Dashboard View -->
    <main class="app__body" id="hubView">
      <div class="app__empty" id="emptyState" style="display:none;">
        <p>暂无可用工具。工具加载中……</p>
      </div>
      <div class="tools-grid" id="toolsGrid"></div>
    </main>

    <!-- Embedded Daily News View -->
    <div class="news-view" id="newsView" style="display:none;">
      <div class="news-view__toolbar">
        <button class="news-view__back" id="backToHub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          返回
        </button>
        <div class="news-view__title">每日新闻日报</div>
        <div class="news-view__publish-time" id="publishTime"></div>
        <div class="news-view__actions">
          <button class="btn btn--secondary btn--sm" id="backToLatestBtn" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            返回最新
          </button>
          <button class="btn btn--primary btn--sm" id="collectBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c2.5-2.5 4-5.6 4-9s-1.5-6.5-4-9m-9 9a9 9 0 0 1 9-9"></path>
            </svg>
            手动收集
          </button>
          <button class="btn btn--secondary btn--sm" id="refreshBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.33L23 10"></path>
            </svg>
            刷新
          </button>
          <button class="btn btn--secondary btn--sm" id="toggleHistoryBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9"></path>
              <polyline points="3 4 3 10 9 10"></polyline>
            </svg>
            历史
          </button>
        </div>
      </div>
      <div class="news-view__content">
        <div class="news-view__main">
          <iframe class="news-view__iframe" id="newsIframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
        <aside class="news-view__sidebar" id="historySidebar">
          <div class="history-panel">
            <div class="history-panel__header">
              <span>历史归档</span>
              <button class="history-panel__close" id="closeHistoryBtn">&times;</button>
            </div>
            <div class="history-panel__list" id="historyList"></div>
          </div>
        </aside>
      </div>
      <div class="news-view__status" id="collectStatus" style="display:none;">
        <div class="news-view__status-content">
          <span class="news-view__status-icon" id="collectStatusIcon"></span>
          <span class="news-view__status-text" id="collectStatusText"></span>
        </div>
      </div>
    </div>

    <footer class="app__footer">
      <span>由凯尔希电子助手系统生成 · Kal'tsit Electronic Assistant System</span>
    </footer>

    <!-- Update Notification Modal -->
    <div class="modal-overlay" id="updateModal" style="display:none;">
      <div class="modal">
        <div class="modal__header">
          <h2 class="modal__title">发现新版本</h2>
        </div>
        <div class="modal__body" id="updateModalBody">
          <p>新版本 <strong id="newVersion"></strong> 已可用。</p>
          <p class="modal__update-source" id="updateSource"></p>
          <div class="modal__release-notes" id="releaseNotes"></div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--secondary" id="laterBtn">稍后更新</button>
          <button class="btn btn--primary" id="downloadBtn">立即下载</button>
        </div>
      </div>
    </div>

    <!-- Download Progress Modal -->
    <div class="modal-overlay" id="progressModal" style="display:none;">
      <div class="modal">
        <div class="modal__header">
          <h2 class="modal__title">正在下载更新</h2>
        </div>
        <div class="modal__body">
          <div class="progress-bar">
            <div class="progress-bar__fill" id="progressFill"></div>
          </div>
          <p class="progress-text" id="progressText">0%</p>
          <p class="progress-speed" id="progressSpeed"></p>
        </div>
        <div class="modal__footer" id="progressFooter" style="display:none;">
          <button class="btn btn--primary" id="installBtn">立即安装并重启</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
